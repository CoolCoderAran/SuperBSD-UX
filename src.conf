# ==============================================================================
# SuperBSD-UX 1.0 Master Build Configuration (src.conf)
# Fully bypasses purged architectures, legacy drivers, and obsolete protocols
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ARCHITECTURE & 32-BIT BYPASSES
# ------------------------------------------------------------------------------
WITHOUT_32BIT_LIBS=yes
WITHOUT_I386=yes

# ------------------------------------------------------------------------------
# 2. PURGED AUTHENTICATION & LEGACY PROTOCOLS
# ------------------------------------------------------------------------------
WITHOUT_KERBEROS=yes
WITHOUT_KERBEROS_SUPPORT=yes
WITHOUT_NIS=yes
WITHOUT_TALK=yes
WITHOUT_TFTP=yes
WITHOUT_TELNET=yes
WITHOUT_FINGER=yes

# ------------------------------------------------------------------------------
# 3. PURGED FILESYSTEMS & STORAGE CONTROLLERS
# ------------------------------------------------------------------------------
WITHOUT_CD9660=yes
WITHOUT_EXT2FS=yes
WITHOUT_UDF=yes
WITHOUT_HPFS=yes
WITHOUT_PSTORE=yes
WITHOUT_FDESCFS=yes

# ------------------------------------------------------------------------------
# 4. PURGED BUS & HARDWARE DRIVERS
# ------------------------------------------------------------------------------
WITHOUT_ISA=yes
WITHOUT_CARDBUS=yes
WITHOUT_PCCARD=yes
WITHOUT_FLOPPY=yes
WITHOUT_BLUETOOTH=yes
WITHOUT_ATM=yes

# ------------------------------------------------------------------------------
# 5. DEPRECATED NETWORKING & UTILITIES
# ------------------------------------------------------------------------------
WITHOUT_PPP=yes
WITHOUT_BOOTP=yes
WITHOUT_NETATALK=yes
WITHOUT_IPX=yes
WITHOUT_FDFORMAT=yes

# ------------------------------------------------------------------------------
# 6. PERFORMANCE & COMPILATION OPTIMIZATIONS
# ------------------------------------------------------------------------------
# Disable building legacy tests/examples to accelerate build times
WITHOUT_TESTS=yes
WITHOUT_EXAMPLES=yes


# Disable purged NIS / Yellow Pages
WITHOUT_NIS=yes

# Disable purged Talk and LPR printing
WITHOUT_TALK=yes
WITHOUT_LPR=yes

# Disable legacy unencrypted r-commands (rsh, rlogin, talkd)
WITHOUT_RCMD=yes
